services:
  db:
    image: postgres:16
    container_name: secassess-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secassess}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-secassess}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - secassess_net

  test-db:
    image: postgres:16
    container_name: secassess-test-db
    profiles:
      - test
    restart: unless-stopped
    environment:
      POSTGRES_DB: secassess_test
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - test_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d secassess_test" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - secassess_net

  backend:
    image: secassess-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secassess-backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secassess}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-secassess}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeyforuniversityprojecttestingonly12345}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ZAP_API_URL: ${ZAP_API_URL:-http://zap:8080}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3-flash-preview}
      AI_ENABLED: ${AI_ENABLED:-true}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-60}
      AI_MAX_OUTPUT_TOKENS: ${AI_MAX_OUTPUT_TOKENS:-8192}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@secassess.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminSecurePassword123!}
      SEED_ASSESSOR_EMAIL: ${SEED_ASSESSOR_EMAIL:-assessor@secassess.local}
      SEED_ASSESSOR_PASSWORD: ${SEED_ASSESSOR_PASSWORD:-AssessorSecurePassword123!}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - secassess_net
      - scan_net

  test-runner:
    image: secassess-backend
    build:
      context: ./backend
      dockerfile: Dockerfile
    profiles:
      - test
    command: sh -c "alembic upgrade head && pytest -v"
    volumes:
      - ./backend:/app
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@test-db:5432/secassess_test
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@test-db:5432/secassess_test
      AI_ENABLED: "false"
      GEMINI_API_KEY: ""
      ZAP_API_URL: ${ZAP_API_URL:-http://zap:8080}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
    depends_on:
      test-db:
        condition: service_healthy
    networks:
      - secassess_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secassess-frontend
    restart: unless-stopped
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - secassess_net

  juice-shop:
    image: bkimminich/juice-shop
    container_name: secassess-juice-shop
    profiles:
      - targets
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - scan_net
      - browse_net

  zap:
    image: zaproxy/zap-stable
    container_name: secassess-zap
    profiles:
      - targets
    command:
      - zap.sh
      - -daemon
      - -host
      - 0.0.0.0
      - -port
      - "8080"
      - -config
      - api.key=${ZAP_API_KEY:-}
      - -config
      - api.addrs.addr.name=.*
      - -config
      - api.addrs.addr.regex=true
    environment:
      ZAP_API_KEY: ${ZAP_API_KEY:-}
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS --get --data-urlencode "apikey=$${ZAP_API_KEY}" http://127.0.0.1:8080/JSON/core/view/version/ > /dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s
    networks:
      - scan_net

  kdrama-db:
    image: mysql:8.0
    container_name: secassess-kdrama-db
    environment:
      MYSQL_DATABASE: kdrama_watchlist
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
    volumes:
      - kdrama_db_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 5s
      timeout: 2s
      retries: 5
    networks:
      - scan_net

  kdrama-target:
    build:
      context: ./targets/SarangTV-backend
    container_name: secassess-kdrama-target
    depends_on:
      kdrama-db:
        condition: service_healthy
    env_file:
      - ./targets/SarangTV-backend/.env
    environment:
      DB_CONNECTION: mysql
      DB_HOST: kdrama-db
      DB_PORT: 3306
      DB_DATABASE: kdrama_watchlist
      DB_USERNAME: root
      DB_PASSWORD: ""
      APP_ENV: local
      APP_URL: http://localhost:8081
    ports:
      - "127.0.0.1:8081:8000"
    networks:
      - scan_net
      - browse_net

volumes:
  postgres_data:
    name: secassess_postgres_data
  test_postgres_data:
    name: secassess_test_postgres_data
  kdrama_db_data:

networks:
  secassess_net:
    name: secassess_net
  browse_net:
    name: secassess_browse_net      # normal bridge, only for browser access to targets
  scan_net:
    name: secassess_scan_net
    internal: true                  # no internet route
    ipam:
      config:
        - subnet: 172.30.0.0/24
