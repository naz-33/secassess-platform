services:
  db:
    image: postgres:16
    container_name: secassess-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secassess}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-secassess}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - secassess_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: secassess-backend
    restart: unless-stopped
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-secassess}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-secassess}
      JWT_SECRET: ${JWT_SECRET:-supersecretjwtkeyforuniversityprojecttestingonly12345}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-1440}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ZAP_API_KEY: ${ZAP_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-admin@secassess.local}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-AdminSecurePassword123!}
      SEED_ASSESSOR_EMAIL: ${SEED_ASSESSOR_EMAIL:-assessor@secassess.local}
      SEED_ASSESSOR_PASSWORD: ${SEED_ASSESSOR_PASSWORD:-AssessorSecurePassword123!}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - secassess_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: secassess-frontend
    restart: unless-stopped
    command: npm run dev -- --host
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000/api/v1
    depends_on:
      - backend
    networks:
      - secassess_net

  juice-shop:
    image: bkimminich/juice-shop
    container_name: secassess-juice-shop
    profiles:
      - targets
    ports:
      - "127.0.0.1:3000:3000"
    networks:
      - secassess_net

  zap:
    image: zaproxy/zap-stable
    container_name: secassess-zap
    profiles:
      - targets
    command: zap.sh -daemon -host 0.0.0.0 -port 8080 -config api.key=${ZAP_API_KEY:-change-me-zap-api-key-token} -config api.addrs.addr.name=.* -config api.addrs.addr.regex=true
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - secassess_net

volumes:
  postgres_data:
    name: secassess_postgres_data

networks:
  secassess_net:
    name: secassess_net
