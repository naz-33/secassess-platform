<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="10" y1="10" x2="22" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#06b6d4" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Dark background rounded square -->
  <rect width="32" height="32" rx="7" fill="#0f172a" />
  <rect width="30" height="30" x="1" y="1" rx="6" stroke="#1e293b" stroke-width="1" />

  <!-- Shield Shape -->
  <path 
    d="M16 4.5L7.5 8.2V14.8C7.5 20.3 11.1 25.4 16 27.5C20.9 25.4 24.5 20.3 24.5 14.8V8.2L16 4.5Z" 
    fill="url(#shieldGrad)" 
    fill-opacity="0.2"
    stroke="url(#shieldGrad)" 
    stroke-width="1.8" 
    stroke-linejoin="round"
    filter="url(#glow)"
  />

  <!-- Inner Security / Target Node Core -->
  <path 
    d="M16 9L11 11.2V15C11 18.5 13.1 21.7 16 23.2C18.9 21.7 21 18.5 21 15V11.2L16 9Z" 
    fill="url(#accentGrad)" 
    opacity="0.9"
  />

  <!-- Subtle Check / Pulse Accent -->
  <path 
    d="M14 16L15.5 17.5L18.5 14.5" 
    stroke="#ffffff" 
    stroke-width="1.5" 
    stroke-linecap="round" 
    stroke-linejoin="round" 
  />
</svg>

